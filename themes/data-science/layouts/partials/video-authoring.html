<section id="video-authoring" class="video-authoring" hidden aria-labelledby="video-authoring-title" data-invalid-url="{{ i18n "video_invalid_url" }}" data-missing-title="{{ i18n "video_missing_title" }}" data-short-label="{{ i18n "video_type_short" }}" data-regular-label="{{ i18n "video_type_regular" }}" data-ready="{{ i18n "video_ready" }}" data-exported="{{ i18n "video_exported" }}">
  <div class="video-authoring__header">
    <div>
      <h2 id="video-authoring-title">{{ i18n "video_tool_title" }}</h2>
      <p>{{ i18n "video_tool_description" }}</p>
    </div>
    <button id="video-close" class="video-close" type="button" aria-label="{{ i18n "video_close" }}">×</button>
  </div>

  <form id="video-form" class="video-form">
    <div class="video-form__fields">
      <label for="video-title">{{ i18n "video_title_label" }}</label>
      <input id="video-title" name="video-title" type="text" maxlength="140" placeholder="{{ i18n "video_title_placeholder" }}" required>

      <label for="video-url">{{ i18n "video_url_label" }}</label>
      <input id="video-url" name="video-url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" required>
    </div>
    <button id="video-preview-button" class="video-preview-button" type="submit">{{ i18n "video_preview" }}</button>
  </form>

  <div id="video-status" class="video-status" hidden role="status"></div>
  <div id="video-preview" class="video-preview" hidden>
    <div class="video-preview__heading">
      <h3>{{ i18n "video_preview_title" }}</h3>
      <span id="video-type" class="video-type"></span>
    </div>
    <div id="video-frame-wrap" class="video-frame-wrap"></div>
  </div>

  <div class="video-authoring__actions">
    <button id="video-export" class="video-export" type="button" disabled>{{ i18n "video_download_bundle" }}</button>
    <button id="video-cancel" class="video-cancel" type="button">{{ i18n "video_cancel" }}</button>
  </div>
  <p class="video-authoring__note">{{ i18n "video_export_note" }}</p>
</section>
<script src="{{ "js/videos.js" | relURL }}" defer></script>
